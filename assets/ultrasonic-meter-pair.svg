<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Ultrasonic water meter pair</title>
<desc id="desc">Cold and hot ultrasonic MID-certified water meters for apartment installations.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FCFD"/>
    <stop offset="0.52" stop-color="#ECF8FA"/>
    <stop offset="1" stop-color="#EAF7F0"/>
  </linearGradient>
  <radialGradient id="halo" cx="72%" cy="18%" r="70%">
    <stop offset="0" stop-color="#D8F8FF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#EAFBFF" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20C6E6"/>
    <stop offset="1" stop-color="#16C8A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B3851"/>
    <stop offset="1" stop-color="#071D2B"/>
  </linearGradient>
  <linearGradient id="greenline" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16C8A8"/>
    <stop offset="1" stop-color="#7ED957"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.45" stop-color="#DDEAF0"/>
    <stop offset="1" stop-color="#B7CDD8"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#062334" flood-opacity="0.18"/>
  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062334" flood-opacity="0.14"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="dotgrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#9ADBE8" opacity="0.38"/>
  </pattern>
  <style><![CDATA[
    .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #071D2B; letter-spacing:-1px; }
    .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #6D8392; }
    .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #071D2B; }
    .small { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #6D8392; }
    .micro { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #6D8392; letter-spacing:.8px; }
    .white { fill:#fff; }
    .stroke { stroke:#071D2B; stroke-opacity:.13; }
    .line { fill:none; stroke:url(#aqua); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .line2 { fill:none; stroke:#7ED957; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .wire { fill:none; stroke:#22C5E4; stroke-width:4; stroke-dasharray:10 14; stroke-linecap:round; opacity:.86; }
    .device { fill:#fff; stroke:#D6E9EF; stroke-width:2; filter:url(#smallShadow); }
    .card { fill:#fff; stroke:#DCEFF4; stroke-width:2; filter:url(#softShadow); }
    .panel { fill:rgba(255,255,255,.86); stroke:#DCEFF4; stroke-width:2; }
  ]]></style>
</defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#dotgrid)" opacity="0.45"/>
  <path d="M-80 738 C 400 576, 544 864, 928 711 S 1488 549, 1690 684" fill="none" stroke="#B7EEF7" stroke-width="2" opacity=".65"/>
  <path d="M-90 225 C 224 126, 464 279, 752 162 S 1280 72, 1670 153" fill="none" stroke="#CFE9D1" stroke-width="2" opacity=".55"/>


<text x="90" y="100" class="title">Ultrasonic meters for reliable cold and hot water measurement.</text>
<text x="92" y="143" class="subtitle">New apartment buildings often require two apartment meters: one for cold water and one for warm water.</text>
<g transform="translate(130,230)">
  <rect x="0" y="0" width="590" height="560" rx="42" fill="#ffffff" stroke="#DCEFF4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="48" y="70" class="label">Cold water meter</text>
  <text x="48" y="108" class="small">Ultrasonic measurement, remote reading and MID-certified metrology.</text>

<g transform="translate(298,288) scale(1.28)">
  <rect x="-136" y="-55" width="272" height="110" rx="46" fill="url(#metal)" stroke="#9BB9C5" stroke-width="3" filter="url(#smallShadow)"/>
  <rect x="-62" y="-84" width="124" height="168" rx="34" fill="#ffffff" stroke="#C8DEE7" stroke-width="3"/>
  <circle cx="0" cy="-7" r="38" fill="#F3FBFD" stroke="#B8EAF2" stroke-width="4"/>
  <path d="M-25 -5 A25 25 0 0 1 30 -5" fill="none" stroke="url(#aqua)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="0" cy="-7" r="4" fill="#071D2B"/>
  <path d="M0 -7 L18 -29" stroke="#071D2B" stroke-width="4" stroke-linecap="round"/>
  <rect x="-44" y="46" width="88" height="24" rx="12" fill="#E9F9F7"/>
  <text x="0" y="63" class="micro" text-anchor="middle" style="fill:#16C8A8;">MID T50</text>
  <circle cx="-155" cy="0" r="18" fill="#C2D6DE"/>
  <circle cx="155" cy="0" r="18" fill="#C2D6DE"/>
</g>
  <rect x="88" y="458" width="146" height="42" rx="21.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="161.0" y="486.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Cold water</text>
<rect x="252" y="458" width="132" height="42" rx="21.0" fill="#0B2D42" filter="url(#smallShadow)"/><text x="318.0" y="486.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">No moving parts</text>
<rect x="404" y="458" width="112" height="42" rx="21.0" fill="url(#greenline)" filter="url(#smallShadow)"/><text x="460.0" y="486.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Alerts</text>

</g>
<g transform="translate(880,230)">
  <rect x="0" y="0" width="590" height="560" rx="42" fill="#ffffff" stroke="#DCEFF4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="48" y="70" class="label">Warm water meter</text>
  <text x="48" y="108" class="small">Specified for T90-class warm water deployments where required.</text>
  <g filter="url(#smallShadow)">
    <circle cx="308" cy="291" r="190" fill="#FFF7ED"/>
  </g>

<g transform="translate(298,288) scale(1.28)">
  <rect x="-136" y="-55" width="272" height="110" rx="46" fill="url(#metal)" stroke="#9BB9C5" stroke-width="3" filter="url(#smallShadow)"/>
  <rect x="-62" y="-84" width="124" height="168" rx="34" fill="#ffffff" stroke="#C8DEE7" stroke-width="3"/>
  <circle cx="0" cy="-7" r="38" fill="#F3FBFD" stroke="#B8EAF2" stroke-width="4"/>
  <path d="M-25 -5 A25 25 0 0 1 30 -5" fill="none" stroke="url(#aqua)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="0" cy="-7" r="4" fill="#071D2B"/>
  <path d="M0 -7 L18 -29" stroke="#071D2B" stroke-width="4" stroke-linecap="round"/>
  <rect x="-44" y="46" width="88" height="24" rx="12" fill="#E9F9F7"/>
  <text x="0" y="63" class="micro" text-anchor="middle" style="fill:#16C8A8;">MID T90</text>
  <circle cx="-155" cy="0" r="18" fill="#C2D6DE"/>
  <circle cx="155" cy="0" r="18" fill="#C2D6DE"/>
</g>
  <rect x="88" y="458" width="146" height="42" rx="21.0" fill="#FFB05A" filter="url(#smallShadow)"/><text x="161.0" y="486.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Warm water</text>
<rect x="252" y="458" width="160" height="42" rx="21.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="332.0" y="486.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Apartment pair</text>
<rect x="432" y="458" width="82" height="42" rx="21.0" fill="url(#greenline)" filter="url(#smallShadow)"/><text x="473.0" y="486.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">QR</text>

</g>
<path d="M720 510 C 785 455, 815 455, 880 510" class="wire"/>
<circle cx="800" cy="475" r="12" fill="url(#aqua)" filter="url(#glow)"/>

</svg>
