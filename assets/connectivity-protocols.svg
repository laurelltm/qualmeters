<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Connectivity protocols</title>
<desc id="desc">Protocol cards for Modbus, Wireless M-Bus, NB-IoT and future integrations.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FCFD"/>
    <stop offset="0.52" stop-color="#ECF8FA"/>
    <stop offset="1" stop-color="#EAF7F0"/>
  </linearGradient>
  <radialGradient id="halo" cx="72%" cy="18%" r="70%">
    <stop offset="0" stop-color="#D8F8FF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#EAFBFF" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20C6E6"/>
    <stop offset="1" stop-color="#16C8A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B3851"/>
    <stop offset="1" stop-color="#071D2B"/>
  </linearGradient>
  <linearGradient id="greenline" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16C8A8"/>
    <stop offset="1" stop-color="#7ED957"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.45" stop-color="#DDEAF0"/>
    <stop offset="1" stop-color="#B7CDD8"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#062334" flood-opacity="0.18"/>
  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062334" flood-opacity="0.14"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="dotgrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#9ADBE8" opacity="0.38"/>
  </pattern>
  <style><![CDATA[
    .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #071D2B; letter-spacing:-1px; }
    .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #6D8392; }
    .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #071D2B; }
    .small { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #6D8392; }
    .micro { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #6D8392; letter-spacing:.8px; }
    .white { fill:#fff; }
    .stroke { stroke:#071D2B; stroke-opacity:.13; }
    .line { fill:none; stroke:url(#aqua); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .line2 { fill:none; stroke:#7ED957; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .wire { fill:none; stroke:#22C5E4; stroke-width:4; stroke-dasharray:10 14; stroke-linecap:round; opacity:.86; }
    .device { fill:#fff; stroke:#D6E9EF; stroke-width:2; filter:url(#smallShadow); }
    .card { fill:#fff; stroke:#DCEFF4; stroke-width:2; filter:url(#softShadow); }
    .panel { fill:rgba(255,255,255,.86); stroke:#DCEFF4; stroke-width:2; }
  ]]></style>
</defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#dotgrid)" opacity="0.45"/>
  <path d="M-80 738 C 400 576, 544 864, 928 711 S 1488 549, 1690 684" fill="none" stroke="#B7EEF7" stroke-width="2" opacity=".65"/>
  <path d="M-90 225 C 224 126, 464 279, 752 162 S 1280 72, 1670 153" fill="none" stroke="#CFE9D1" stroke-width="2" opacity=".55"/>


<text x="90" y="100" class="title">Built for the protocols utilities already use.</text>
<text x="92" y="143" class="subtitle">QualMeters is specified as a protocol-neutral platform for mixed meter estates and phased rollouts.</text>
<g transform="translate(115,250)">
  <rect class="card" x="0" y="0" width="320" height="360" rx="30"/>

  <circle cx="160" cy="96" r="54" fill="url(#aqua)"/>
  <path d="M128 96 H192 M160 64 V132" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <text x="160" y="190" class="label" text-anchor="middle">Modbus</text>
  <text x="160" y="232" class="small" text-anchor="middle">For wired devices, local</text>
  <text x="160" y="258" class="small" text-anchor="middle">gateways and industrial</text>
  <text x="160" y="284" class="small" text-anchor="middle">integration scenarios.</text>
  <rect x="76" y="314" width="168" height="38" rx="19.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="160.0" y="340.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">RTU / TCP</text>

  <rect class="card" x="385" y="0" width="320" height="360" rx="30"/>

  <circle cx="545" cy="96" r="54" fill="url(#greenline)"/>
  <path d="M512 100 C530 76, 570 76, 588 100 M525 122 C540 106, 560 106, 575 122" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
  <text x="545" y="190" class="label" text-anchor="middle">Wireless M-Bus</text>
  <text x="545" y="232" class="small" text-anchor="middle">Low-power radio for</text>
  <text x="545" y="258" class="small" text-anchor="middle">apartment buildings and</text>
  <text x="545" y="284" class="small" text-anchor="middle">sub-metering networks.</text>
  <rect x="472" y="314" width="146" height="38" rx="19.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="545.0" y="340.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">OMS-ready</text>

  <rect class="card" x="770" y="0" width="320" height="360" rx="30"/>

  <circle cx="930" cy="96" r="54" fill="#071D2B"/>
  <path d="M900 120 C910 82, 960 82, 970 120" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="935" cy="103" r="11" fill="#20C6E6"/>
  <text x="930" y="190" class="label" text-anchor="middle">NB-IoT</text>
  <text x="930" y="232" class="small" text-anchor="middle">Direct cloud connection</text>
  <text x="930" y="258" class="small" text-anchor="middle">for meters with cellular</text>
  <text x="930" y="284" class="small" text-anchor="middle">connectivity.</text>
  <rect x="850" y="314" width="160" height="38" rx="19.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="930.0" y="340.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">LPWAN / 5G</text>

  <rect class="card" x="1155" y="0" width="320" height="360" rx="30"/>

  <circle cx="1315" cy="96" r="54" fill="#F0F7FF" stroke="#BBD4FF" stroke-width="3"/>
  <path d="M1282 94 L1315 65 L1348 94 L1315 129 Z" fill="url(#aqua)"/>
  <text x="1315" y="190" class="label" text-anchor="middle">Open adapters</text>
  <text x="1315" y="232" class="small" text-anchor="middle">Extend with additional</text>
  <text x="1315" y="258" class="small" text-anchor="middle">device vendors, APIs and</text>
  <text x="1315" y="284" class="small" text-anchor="middle">billing systems.</text>
  <rect x="1228" y="314" width="174" height="38" rx="19.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="1315.0" y="340.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">REST / MQTT</text>

</g>
<g transform="translate(355,725)">
  <rect x="0" y="0" width="890" height="92" rx="46" fill="#ffffff" stroke="#DCEFF4" stroke-width="2" filter="url(#smallShadow)"/>
  <text x="445" y="38" class="small" text-anchor="middle" style="font-weight:800; fill:#071D2B;">Protocol data is normalized into one reading, event and alarm model.</text>
  <text x="445" y="66" class="small" text-anchor="middle">That keeps portals, APIs and analytics independent from the meter transport layer.</text>
</g>
</svg>
