<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Deployment lifecycle</title>
<desc id="desc">Survey, installation, commissioning, monitoring and lifecycle maintenance.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FCFD"/>
    <stop offset="0.52" stop-color="#ECF8FA"/>
    <stop offset="1" stop-color="#EAF7F0"/>
  </linearGradient>
  <radialGradient id="halo" cx="72%" cy="18%" r="70%">
    <stop offset="0" stop-color="#D8F8FF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#EAFBFF" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20C6E6"/>
    <stop offset="1" stop-color="#16C8A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B3851"/>
    <stop offset="1" stop-color="#071D2B"/>
  </linearGradient>
  <linearGradient id="greenline" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16C8A8"/>
    <stop offset="1" stop-color="#7ED957"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.45" stop-color="#DDEAF0"/>
    <stop offset="1" stop-color="#B7CDD8"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#062334" flood-opacity="0.18"/>
  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062334" flood-opacity="0.14"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="dotgrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#9ADBE8" opacity="0.38"/>
  </pattern>
  <style><![CDATA[
    .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #071D2B; letter-spacing:-1px; }
    .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #6D8392; }
    .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #071D2B; }
    .small { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #6D8392; }
    .micro { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #6D8392; letter-spacing:.8px; }
    .white { fill:#fff; }
    .stroke { stroke:#071D2B; stroke-opacity:.13; }
    .line { fill:none; stroke:url(#aqua); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .line2 { fill:none; stroke:#7ED957; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .wire { fill:none; stroke:#22C5E4; stroke-width:4; stroke-dasharray:10 14; stroke-linecap:round; opacity:.86; }
    .device { fill:#fff; stroke:#D6E9EF; stroke-width:2; filter:url(#smallShadow); }
    .card { fill:#fff; stroke:#DCEFF4; stroke-width:2; filter:url(#softShadow); }
    .panel { fill:rgba(255,255,255,.86); stroke:#DCEFF4; stroke-width:2; }
  ]]></style>
</defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#dotgrid)" opacity="0.45"/>
  <path d="M-80 738 C 400 576, 544 864, 928 711 S 1488 549, 1690 684" fill="none" stroke="#B7EEF7" stroke-width="2" opacity=".65"/>
  <path d="M-90 225 C 224 126, 464 279, 752 162 S 1280 72, 1670 153" fill="none" stroke="#CFE9D1" stroke-width="2" opacity=".55"/>


<text x="90" y="100" class="title">From site survey to lifecycle maintenance.</text>
<text x="92" y="143" class="subtitle">QualMeters is specified as a managed system, not a one-time meter delivery.</text>
<g transform="translate(95,285)">
  <path d="M160 210 H1280" stroke="#C8E9EE" stroke-width="14" stroke-linecap="round"/>
  <path d="M160 210 H1280" stroke="url(#aqua)" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 22"/>
  <g transform="translate(0,0)">
    <circle cx="160" cy="210" r="76" fill="#ffffff" stroke="#DCEFF4" stroke-width="3" filter="url(#smallShadow)"/>
    <path d="M132 210 h56 m-28 -28 v56" stroke="url(#aqua)" stroke-width="12" stroke-linecap="round"/>
    <text x="160" y="330" class="label" text-anchor="middle">Survey</text>
    <text x="160" y="365" class="small" text-anchor="middle">meter estate &amp; network</text>
  </g>
  <g transform="translate(280,0)">
    <circle cx="160" cy="210" r="76" fill="#ffffff" stroke="#DCEFF4" stroke-width="3" filter="url(#smallShadow)"/>
    <path d="M125 210 l32 32 l62 -76" stroke="url(#greenline)" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="330" class="label" text-anchor="middle">Install</text>
    <text x="160" y="365" class="small" text-anchor="middle">meters &amp; gateway</text>
  </g>
  <g transform="translate(560,0)">
    <circle cx="160" cy="210" r="76" fill="#ffffff" stroke="#DCEFF4" stroke-width="3" filter="url(#smallShadow)"/>
    <path d="M130 180 H190 V240 H130 Z" fill="#071D2B"/><circle cx="160" cy="210" r="18" fill="url(#aqua)"/>
    <text x="160" y="330" class="label" text-anchor="middle">Commission</text>
    <text x="160" y="365" class="small" text-anchor="middle">validate readings</text>
  </g>
  <g transform="translate(840,0)">
    <circle cx="160" cy="210" r="76" fill="#ffffff" stroke="#DCEFF4" stroke-width="3" filter="url(#smallShadow)"/>
    <path d="M115 240 C140 205, 160 225, 185 170 S220 198, 230 150" class="line"/>
    <text x="160" y="330" class="label" text-anchor="middle">Operate</text>
    <text x="160" y="365" class="small" text-anchor="middle">monitor &amp; alert</text>
  </g>
  <g transform="translate(1120,0)">
    <circle cx="160" cy="210" r="76" fill="#ffffff" stroke="#DCEFF4" stroke-width="3" filter="url(#smallShadow)"/>
    <path d="M160 145 A65 65 0 1 1 114 256" fill="none" stroke="url(#aqua)" stroke-width="12" stroke-linecap="round"/><path d="M104 249 L119 288 L142 254" fill="url(#aqua)"/>
    <text x="160" y="330" class="label" text-anchor="middle">Maintain</text>
    <text x="160" y="365" class="small" text-anchor="middle">remote diagnostics</text>
  </g>
</g>
<g transform="translate(356,720)">
  <rect x="0" y="0" width="890" height="78" rx="39" fill="#ffffff" stroke="#DCEFF4" stroke-width="2" filter="url(#smallShadow)"/>
  <text x="445" y="49" class="small" text-anchor="middle">A managed lifecycle keeps data quality high after the installation is complete.</text>
</g>
</svg>
