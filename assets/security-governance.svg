<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Security and data governance</title>
<desc id="desc">Security shield, encrypted communication, tenant boundaries and audit logs.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FCFD"/>
    <stop offset="0.52" stop-color="#ECF8FA"/>
    <stop offset="1" stop-color="#EAF7F0"/>
  </linearGradient>
  <radialGradient id="halo" cx="72%" cy="18%" r="70%">
    <stop offset="0" stop-color="#D8F8FF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#EAFBFF" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20C6E6"/>
    <stop offset="1" stop-color="#16C8A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B3851"/>
    <stop offset="1" stop-color="#071D2B"/>
  </linearGradient>
  <linearGradient id="greenline" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16C8A8"/>
    <stop offset="1" stop-color="#7ED957"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.45" stop-color="#DDEAF0"/>
    <stop offset="1" stop-color="#B7CDD8"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#062334" flood-opacity="0.18"/>
  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062334" flood-opacity="0.14"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="dotgrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#9ADBE8" opacity="0.38"/>
  </pattern>
  <style><![CDATA[
    .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #071D2B; letter-spacing:-1px; }
    .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #6D8392; }
    .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #071D2B; }
    .small { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #6D8392; }
    .micro { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #6D8392; letter-spacing:.8px; }
    .white { fill:#fff; }
    .stroke { stroke:#071D2B; stroke-opacity:.13; }
    .line { fill:none; stroke:url(#aqua); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .line2 { fill:none; stroke:#7ED957; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .wire { fill:none; stroke:#22C5E4; stroke-width:4; stroke-dasharray:10 14; stroke-linecap:round; opacity:.86; }
    .device { fill:#fff; stroke:#D6E9EF; stroke-width:2; filter:url(#smallShadow); }
    .card { fill:#fff; stroke:#DCEFF4; stroke-width:2; filter:url(#softShadow); }
    .panel { fill:rgba(255,255,255,.86); stroke:#DCEFF4; stroke-width:2; }
  ]]></style>
</defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#dotgrid)" opacity="0.45"/>
  <path d="M-80 738 C 400 576, 544 864, 928 711 S 1488 549, 1690 684" fill="none" stroke="#B7EEF7" stroke-width="2" opacity=".65"/>
  <path d="M-90 225 C 224 126, 464 279, 752 162 S 1280 72, 1670 153" fill="none" stroke="#CFE9D1" stroke-width="2" opacity=".55"/>


<text x="90" y="100" class="title">Designed for secure utility-grade data operations.</text>
<text x="92" y="143" class="subtitle">Role-based access, encrypted communication, tenant separation and auditability from meter to API.</text>
<g transform="translate(140,235)">
  <rect x="0" y="0" width="580" height="540" rx="46" fill="#ffffff" stroke="#DCEFF4" stroke-width="2" filter="url(#softShadow)"/>
  <path d="M290 94 L450 150 V260 C450 360 386 430 290 468 C194 430 130 360 130 260 V150 Z" fill="#071D2B"/>
  <path d="M290 128 L416 174 V262 C416 342 365 397 290 428 C215 397 164 342 164 262 V174 Z" fill="url(#aqua)" opacity=".92"/>
  <rect x="236" y="252" width="128" height="96" rx="24" fill="#ffffff"/>
  <path d="M260 252 V222 C260 186 280 168 300 168 C320 168 340 186 340 222 V252" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="12" fill="#071D2B"/>
  <path d="M300 300 V324" stroke="#071D2B" stroke-width="8" stroke-linecap="round"/>
</g>
<g transform="translate(850,255)">
  <rect x="0" y="0" width="500" height="500" rx="42" fill="#ffffff" stroke="#DCEFF4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="44" y="64" class="label">Governance layers</text>
  <g transform="translate(44,110)">
    <rect x="0" y="0" width="412" height="64" rx="22" fill="#EAFBFF"/><text x="26" y="40" class="small" style="font-weight:800;fill:#071D2B;">Device identity &amp; provisioning</text>
    <rect x="0" y="88" width="412" height="64" rx="22" fill="#E9F9F7"/><text x="26" y="128" class="small" style="font-weight:800;fill:#071D2B;">Encrypted ingestion</text>
    <rect x="0" y="176" width="412" height="64" rx="22" fill="#F0F7FF"/><text x="26" y="216" class="small" style="font-weight:800;fill:#071D2B;">Tenant roles &amp; permissions</text>
    <rect x="0" y="264" width="412" height="64" rx="22" fill="#FFF7ED"/><text x="26" y="304" class="small" style="font-weight:800;fill:#071D2B;">Audit logs &amp; reporting</text>
  </g>
</g>
<path d="M710 510 C 790 500, 805 425, 850 410" class="wire"/>
<rect x="310" y="790" width="160" height="44" rx="22.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="390.0" y="819.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">RBAC</text>
<rect x="490" y="790" width="170" height="44" rx="22.0" fill="url(#greenline)" filter="url(#smallShadow)"/><text x="575.0" y="819.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Audit logs</text>
<rect x="680" y="790" width="190" height="44" rx="22.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="775.0" y="819.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Encrypted transport</text>
<rect x="890" y="790" width="185" height="44" rx="22.0" fill="#0B2D42" filter="url(#smallShadow)"/><text x="982.5" y="819.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Tenant isolation</text>

</svg>
