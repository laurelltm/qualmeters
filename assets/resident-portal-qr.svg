<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Resident portal QR access</title>
<desc id="desc">Resident scans QR code and confirms the current meter reading to access consumption data.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FCFD"/>
    <stop offset="0.52" stop-color="#ECF8FA"/>
    <stop offset="1" stop-color="#EAF7F0"/>
  </linearGradient>
  <radialGradient id="halo" cx="72%" cy="18%" r="70%">
    <stop offset="0" stop-color="#D8F8FF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#EAFBFF" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20C6E6"/>
    <stop offset="1" stop-color="#16C8A8"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B3851"/>
    <stop offset="1" stop-color="#071D2B"/>
  </linearGradient>
  <linearGradient id="greenline" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16C8A8"/>
    <stop offset="1" stop-color="#7ED957"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.45" stop-color="#DDEAF0"/>
    <stop offset="1" stop-color="#B7CDD8"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#062334" flood-opacity="0.18"/>
  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062334" flood-opacity="0.14"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="dotgrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#9ADBE8" opacity="0.38"/>
  </pattern>
  <style><![CDATA[
    .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #071D2B; letter-spacing:-1px; }
    .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #6D8392; }
    .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #071D2B; }
    .small { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #6D8392; }
    .micro { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #6D8392; letter-spacing:.8px; }
    .white { fill:#fff; }
    .stroke { stroke:#071D2B; stroke-opacity:.13; }
    .line { fill:none; stroke:url(#aqua); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .line2 { fill:none; stroke:#7ED957; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .wire { fill:none; stroke:#22C5E4; stroke-width:4; stroke-dasharray:10 14; stroke-linecap:round; opacity:.86; }
    .device { fill:#fff; stroke:#D6E9EF; stroke-width:2; filter:url(#smallShadow); }
    .card { fill:#fff; stroke:#DCEFF4; stroke-width:2; filter:url(#softShadow); }
    .panel { fill:rgba(255,255,255,.86); stroke:#DCEFF4; stroke-width:2; }
  ]]></style>
</defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#dotgrid)" opacity="0.45"/>
  <path d="M-80 738 C 400 576, 544 864, 928 711 S 1488 549, 1690 684" fill="none" stroke="#B7EEF7" stroke-width="2" opacity=".65"/>
  <path d="M-90 225 C 224 126, 464 279, 752 162 S 1280 72, 1670 153" fill="none" stroke="#CFE9D1" stroke-width="2" opacity=".55"/>


<text x="90" y="100" class="title">A resident portal that turns meter data into everyday insight.</text>
<text x="92" y="143" class="subtitle">QR-based meter access, current-reading verification and consumption graphs designed for mobile use.</text>
<g transform="translate(140,230)">

<g transform="translate(0,0)">
  <rect x="0" y="0" width="230" height="450" rx="32" fill="#071D2B" filter="url(#softShadow)"/>
  <rect x="16" y="30" width="198" height="392" rx="22" fill="#F8FDFE"/>
  <rect x="66" y="13" width="58" height="8" rx="4" fill="#27485A"/>
</g>
  <rect x="34" y="66" width="162" height="162" rx="18" fill="#fff" stroke="#DCEFF4" stroke-width="2"/>
  <g fill="#071D2B">
    <rect x="54" y="86" width="34" height="34" rx="3"/><rect x="142" y="86" width="34" height="34" rx="3"/><rect x="54" y="174" width="34" height="34" rx="3"/>
    <rect x="98" y="92" width="14" height="14"/><rect x="118" y="92" width="18" height="18"/><rect x="98" y="118" width="24" height="12"/><rect x="134" y="128" width="12" height="26"/>
    <rect x="100" y="160" width="16" height="16"/><rect x="122" y="160" width="14" height="36"/><rect x="146" y="164" width="18" height="18"/>
  </g>
  <text x="115" y="275" class="small" text-anchor="middle" style="font-weight:800;fill:#071D2B;">Scan meter QR</text>
  <rect x="34" y="304" width="162" height="46" rx="18" fill="#EAFBFF"/>
  <text x="115" y="335" class="small" text-anchor="middle">Enter reading</text>
  <rect x="34" y="368" width="162" height="42" rx="21" fill="url(#aqua)"/>
  <text x="115" y="395" class="micro" text-anchor="middle" style="fill:#fff;">OPEN PORTAL</text>
</g>
<g transform="translate(520,240)">
  <rect x="0" y="0" width="820" height="500" rx="42" fill="#ffffff" stroke="#DCEFF4" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="0" y="0" width="820" height="84" rx="42" fill="#071D2B"/>
  <rect x="0" y="48" width="820" height="36" fill="#071D2B"/>
  <text x="42" y="54" class="label" style="fill:#fff;">My water consumption</text>
  <text x="678" y="54" class="small" style="fill:#BFEFF6;">Apartment A 24</text>
  <rect x="42" y="118" width="190" height="118" rx="26" fill="#EAFBFF"/>
  <text x="72" y="160" class="small" style="fill:#6D8392;">Today</text>
  <text x="72" y="202" class="label">96 L</text>
  <rect x="260" y="118" width="190" height="118" rx="26" fill="#E9F9F7"/>
  <text x="290" y="160" class="small" style="fill:#6D8392;">This month</text>
  <text x="290" y="202" class="label">2.8 m³</text>
  <rect x="478" y="118" width="280" height="118" rx="26" fill="#FFF7ED"/>
  <text x="508" y="160" class="small" style="fill:#6D8392;">Leak guard</text>
  <text x="508" y="202" class="label" style="fill:#D87923;">No alarms</text>
  <path d="M64 400 C122 340, 180 360, 235 310 S330 360, 406 288 S532 320, 612 258 S700 274, 760 238" class="line"/>
  <path d="M64 430 H760" stroke="#DCEFF4" stroke-width="2"/>
  <path d="M64 330 H760" stroke="#DCEFF4" stroke-width="2"/>
</g>
<path d="M368 438 C 430 370, 470 340, 520 325" class="wire"/>
<rect x="160" y="760" width="205" height="44" rx="22.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="262.5" y="789.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">QR + reading verification</text>
<rect x="540" y="780" width="150" height="44" rx="22.0" fill="url(#greenline)" filter="url(#smallShadow)"/><text x="615.0" y="809.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Daily trends</text>
<rect x="710" y="780" width="178" height="44" rx="22.0" fill="url(#aqua)" filter="url(#smallShadow)"/><text x="799.0" y="809.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Leak notifications</text>
<rect x="910" y="780" width="208" height="44" rx="22.0" fill="#0B2D42" filter="url(#smallShadow)"/><text x="1014.0" y="809.0" class="micro" fill="#fff" text-anchor="middle" style="fill:#fff;">Consumption comparison</text>

</svg>
