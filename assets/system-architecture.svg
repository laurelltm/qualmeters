  <circle cx="-155" cy="0" r="18" fill="#C2D6DE"/>
  <circle cx="155" cy="0" r="18" fill="#C2D6DE"/>
</g>

<g transform="translate(145,530) scale(0.62)">
  <rect x="-136" y="-55" width="272" height="110" rx="46" fill="url(#metal)" stroke="#9BB9C5" stroke-width="3" filter="url(#smallShadow)"/>
  <rect x="-62" y="-84" width="124" height="168" rx="34" fill="#ffffff" stroke="#C8DEE7" stroke-width="3"/>
  <circle cx="0" cy="-7" r="38" fill="#F3FBFD" stroke="#B8EAF2" stroke-width="4"/>
  <path d="M-25 -5 A25 25 0 0 1 30 -5" fill="none" stroke="url(#aqua)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="0" cy="-7" r="4" fill="#071D2B"/>
  <path d="M0 -7 L18 -29" stroke="#071D2B" stroke-width="4" stroke-linecap="round"/>
  <rect x="-44" y="46" width="88" height="24" rx="12" fill="#E9F9F7"/>
  <text x="0" y="63" class="micro" text-anchor="middle" style="fill:#16C8A8;">MID</text>
  <circle cx="-155" cy="0" r="18" fill="#C2D6DE"/>
  <circle cx="155" cy="0" r="18" fill="#C2D6DE"/>
</g>
  <g transform="translate(390,210)">
    <rect x="0" y="0" width="180" height="250" rx="30" fill="#071D2B"/>
    <rect x="34" y="42" width="112" height="128" rx="22" fill="#113E58"/>
    <circle cx="90" cy="86" r="28" fill="url(#aqua)"/>
    <path d="M52 192 H128" stroke="#BEEFF6" stroke-width="10" stroke-linecap="round"/>
    <path d="M52 216 H128" stroke="#BEEFF6" stroke-width="10" stroke-linecap="round"/>
    <text x="90" y="286" class="small" text-anchor="middle" style="fill:#071D2B;font-weight:800;">Gateway</text>
  </g>
  <path d="M250 250 C 300 230, 330 230, 390 250" class="wire"/>
  <path d="M250 390 C 315 395, 335 360, 390 350" class="wire"/>
  <path d="M250 530 C 310 515, 335 465, 390 428" class="wire"/>
</g>
